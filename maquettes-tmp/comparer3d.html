<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#F6F0E6;font-family:sans-serif;width:390px}h3{margin:6px 10px 2px;font-size:15px}.l{display:flex;gap:6px;padding:0 6px}.c{flex:1;text-align:center;font-size:12px}canvas{width:186px!important;height:186px!important;border-radius:12px}body.seul canvas{width:378px!important;height:378px!important}</style>
<script type="importmap">{"imports":{"preact":"../vendor/preact.module.js","preact/hooks":"../vendor/hooks.module.js","htm":"../vendor/htm.module.js"}}</script></head><body><div id="z"></div>
<script type="module">
import { chargerThree, preparerEchantillon, monterScene, cadrer } from "../js/composants/echantillon3d.js";
import { grilleMotif } from "../js/rendu/texture.js";
import { grilleEchantillon, cheminDuFil } from "../js/rendu/fil3d.js";
import { pointParId } from "../js/catalogue/points.js";
const ids = new URLSearchParams(location.search).get("ids").split(",");
const petit = new URLSearchParams(location.search).get("petit");
const seul = new URLSearchParams(location.search).get("seul");
const face = new URLSearchParams(location.search).get("face") || "endroit";
const outils = await chargerThree();
const { THREE } = outils;
function rendre(prep) {
  const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  r.setSize(372, 372); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.05;
  r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
  const { scene, table } = monterScene(outils, r, prep, "#C9826B");
  const cam = new THREE.PerspectiveCamera(32, 1, 0.1, 400); cadrer(cam, prep, face, table, seul ? 0.9 : 1.45);
  r.render(scene, cam); return r.domElement;
}
for (const id of ids) {
  const p = pointParId(id);
  const g = grilleEchantillon(grilleMotif(p));
  const f = cheminDuFil(g);
  const avant = { brins: [f.points], largeur: f.largeur, hauteur: f.hauteur, mailles: g[0].length, rangs: g.length };
  const apres = preparerEchantillon(p);
  if (petit) { const c = document.createElement("div"); c.className = "c"; c.style.display = "inline-block"; c.style.width = "190px"; c.append(rendre(apres), Object.assign(document.createElement("div"), { textContent: p.nom })); document.getElementById("z").append(c); continue; }
  const h = document.createElement("h3"); h.textContent = p.nom; document.getElementById("z").append(h);
  const l = document.createElement("div"); l.className = "l";
  for (const [t, prep] of (seul ? [["Après", apres]] : [["Avant", avant], ["Après", apres]])) { const c = document.createElement("div"); c.className = "c"; c.append(rendre(prep), Object.assign(document.createElement("div"), { textContent: t })); l.append(c); }
  document.getElementById("z").append(l);
}
if (seul) document.body.classList.add("seul");
document.body.dataset.pret = "1";
</script></body></html>
